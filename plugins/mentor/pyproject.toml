[project]
name = "openacademy-mentor"
version = "0.1.0"
description = "Mentor: the openacademy teaching protocol as an MCP server over the openacademy API."
requires-python = ">=3.11"
dependencies = ["mcp>=2", "httpx>=0.27"]

[project.scripts]
openacademy-mentor = "mentor.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mentor"]
